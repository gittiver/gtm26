# The URL the site will be built for
base_url = "https://gtm26.de"

# Whether to automatically compile all Sass files in the sass directory
compile_sass =	false #true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Default site language.
default_language = "de"
# Feeds.
generate_feeds = false # true
# Specify feed filenames.
feed_filenames = ["atom.xml", "rss.xml"]
# Taxonomies.
taxonomies = [
	   { name = "tags", feed = true },
           { name = "organisation", feed = true }
]
theme = "austere"

[search]
# Required for search page to work.
index_format = "fuse_javascript"

[slugify]
# Controls slugification for page/section URLs.
paths = "on"
# Controls slugification for taxonomy terms (tags, categories, etc.).
taxonomies = "on"
# Controls slugification for heading anchors (H1 to H6 etc.).
anchors = "on"

[extra]
# Keywords for SEO.
keywords = "Gutes, Tun, Münster, Hack, mshack"
# Site icon in header (optional - comment out to hide).
#site_icon = "gtm_head_banner.png"
# Header strapline (optional - comment out to hide).
strapline = "Gutes Tun Münster. Deine gute Tat. Für dich und Münster."
# Footer text (optional - comment out to hide).
#footer_text = "austere - made for <a href='https://getzola.org'>Zola</a>"
# Favicon (optional - comment out to hide).
#favicon = "/favicon.ico"
# Profile picture on home page (optional - comment out to hide).
#profile_picture = #"/images/profile.svg"

# Enable inline SVG icons (uses sprite sheet).
inline_icons = true
icon_path = "static/icons/"
icons = ["light", "asleep", "rss"]

# Responsive images
image_format = "auto"
image_quality = 80
images_default_size = 1024
images_sizes = [512, 1024, 2048]

# Navigation menu.
menu_links = [
  { url = "$BASE_URL/", name = "Home" },
#  { url = "$BASE_URL/posts/", name = "Posts" },
  { url = "$BASE_URL/proposals/", name = "Was kann ich tun?" },
  { url = "$BASE_URL/initiativen/", name = "Initiativen" },
  { url = "$BASE_URL/about/", name = "About" },
#  { url = "$BASE_URL/tags/", name = "Tags" },
#  { url = "$BASE_URL/projects/", name = "Projects" },
#  { url = "$BASE_URL/search/", name = "Search" },
]

# Custom colour themes. Adjust here to apply own colour.
# Light colours.
[extra.colours.light]
background = "#FAF7F2"
text = "#1a1a1a"
text_muted = "#3a3a3a"
accent = "#9E4440"
accent_hover = "#7A3533"
code_bg = "#f0ebe3"
border = "#e0d9ce"
# Dark colours.
[extra.colours.dark]
background = "#141413"
text = "#e8e8e8"
text_muted = "#a0a0a0"
accent = "#E07A5F"
accent_hover = "#F4A594"
code_bg = "#1e1e1d"
border = "#2a2a29"